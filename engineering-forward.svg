<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P');

      .title1 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 22px;
        fill: #00ffb4;
        filter: url(#glow-cyan);
      }
      .title2 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 22px;
        fill: #ff6ef7;
        filter: url(#glow-pink);
      }

      /* Robot float */
      .robot-group {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-10px); }
      }

      /* Eye pulse */
      .eye-inner {
        animation: eye-pulse 2s ease-in-out infinite;
      }
      @keyframes eye-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }

      /* Chest glow */
      .chest-glow {
        animation: chest-pulse 2.5s ease-in-out infinite;
      }
      @keyframes chest-pulse {
        0%, 100% { opacity: 0.8; }
        50%       { opacity: 0.2; }
      }

      /* Star twinkle */
      .s1 { animation: twinkle 1.8s step-end infinite; }
      .s2 { animation: twinkle 2.4s step-end infinite 0.5s; }
      .s3 { animation: twinkle 1.2s step-end infinite 1.1s; }
      .s4 { animation: twinkle 3.0s step-end infinite 0.3s; }
      .s5 { animation: twinkle 2.0s step-end infinite 1.7s; }
      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.1; }
      }

      /* Glitch on title */
      .glitch-group {
        animation: glitch 7s infinite;
      }
      @keyframes glitch {
        0%, 88%, 100% { transform: translate(0,0); opacity: 1; }
        89%  { transform: translate(-3px, 0); opacity: 0.8; }
        90%  { transform: translate(3px, 0);  opacity: 0.8; }
        91%  { transform: translate(0, 0);    opacity: 1; }
      }

      /* Border pulse */
      .border-rect {
        animation: border-pulse 4s ease-in-out infinite;
      }
      @keyframes border-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
      }

      /* Arm wave */
      .arm-left {
        transform-origin: 102px 230px;
        animation: arm-wave 3s ease-in-out infinite;
      }
      @keyframes arm-wave {
        0%, 100% { transform: rotate(0deg); }
        30%       { transform: rotate(-18deg); }
        60%       { transform: rotate(5deg); }
      }
    </style>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00ffb4" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff6ef7" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-eye">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-chest">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0a0a1a"/>

  <!-- Stars -->
  <g fill="white">
    <rect class="s1" x="30"  y="20"  width="4" height="4"/>
    <rect class="s2" x="80"  y="55"  width="2" height="2"/>
    <rect class="s3" x="140" y="15"  width="4" height="4"/>
    <rect class="s4" x="200" y="40"  width="2" height="2"/>
    <rect class="s5" x="260" y="10"  width="4" height="4"/>
    <rect class="s1" x="320" y="30"  width="2" height="2"/>
    <rect class="s2" x="380" y="18"  width="4" height="4"/>
    <rect class="s3" x="440" y="50"  width="2" height="2"/>
    <rect class="s4" x="500" y="12"  width="4" height="4"/>
    <rect class="s5" x="555" y="38"  width="2" height="2"/>
    <rect class="s3" x="50"  y="80"  width="2" height="2"/>
    <rect class="s1" x="480" y="75"  width="2" height="2"/>
    <rect class="s4" x="160" y="70"  width="2" height="2"/>
    <rect class="s2" x="420" y="90"  width="4" height="4"/>
    <rect class="s5" x="560" y="80"  width="2" height="2"/>
  </g>

  <!-- Ground grid lines (perspective) -->
  <g stroke="#00ffb4" stroke-opacity="0.12" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="370" x2="600" y2="370"/>
    <line x1="0" y1="358" x2="600" y2="358"/>
    <line x1="0" y1="344" x2="600" y2="344"/>
    <!-- Vertical lines vanishing to center -->
    <line x1="300" y1="320" x2="0"   y2="400"/>
    <line x1="300" y1="320" x2="100" y2="400"/>
    <line x1="300" y1="320" x2="200" y2="400"/>
    <line x1="300" y1="320" x2="300" y2="400"/>
    <line x1="300" y1="320" x2="400" y2="400"/>
    <line x1="300" y1="320" x2="500" y2="400"/>
    <line x1="300" y1="320" x2="600" y2="400"/>
  </g>

  <!-- ===================== ROBOT ===================== -->
  <!-- Pixel size = 7, robot centered around x=145 -->
  <g class="robot-group" transform="translate(55, 60)">

    <!-- Antenna -->
    <rect x="84" y="0"  width="21" height="7" fill="#00ffb4"/>
    <rect x="91" y="7"  width="7"  height="7" fill="#00ffb4"/>
    <rect x="91" y="14" width="7"  height="7" fill="#00ffb4"/>

    <!-- Head -->
    <rect x="28" y="21" width="112" height="7"  fill="#445566"/>
    <rect x="21" y="28" width="126" height="7"  fill="#e8e8f0"/>
    <rect x="21" y="35" width="126" height="7"  fill="#e8e8f0"/>
    <!-- Eyes row -->
    <rect x="21" y="42" width="126" height="7"  fill="#e8e8f0"/>
    <rect x="35" y="42" width="21"  height="7"  fill="#ffdd44"/>
    <rect x="112" y="42" width="21" height="7"  fill="#ffdd44"/>
    <!-- Eye pupils -->
    <rect x="42" y="42" width="7"  height="7" fill="#00ffb4" filter="url(#glow-eye)" class="eye-inner"/>
    <rect x="119" y="42" width="7" height="7" fill="#00ffb4" filter="url(#glow-eye)" class="eye-inner"/>

    <rect x="21" y="49" width="126" height="7"  fill="#e8e8f0"/>
    <!-- Mouth area -->
    <rect x="21" y="56" width="126" height="7"  fill="#e8e8f0"/>
    <rect x="42" y="56" width="28"  height="7"  fill="#aaaacc"/>
    <rect x="49" y="56" width="14"  height="7"  fill="#e8e8f0"/>
    <rect x="84" y="56" width="21"  height="7"  fill="#aaaacc"/>
    <rect x="91" y="56" width="7"   height="7"  fill="#e8e8f0"/>

    <rect x="21" y="63" width="126" height="7"  fill="#e8e8f0"/>
    <rect x="28" y="70" width="112" height="7"  fill="#445566"/>

    <!-- Neck -->
    <rect x="56" y="77" width="56" height="7" fill="#aaaacc"/>

    <!-- Torso background -->
    <rect x="0"   y="84" width="168" height="98" fill="#445566"/>
    <rect x="7"   y="91" width="154" height="84" fill="#e8e8f0"/>

    <!-- Arms -->
    <g class="arm-left">
      <rect x="0"  y="91" width="7"  height="77" fill="#445566"/>
      <rect x="7"  y="91" width="7"  height="77" fill="#e8e8f0"/>
    </g>
    <!-- Right arm (static mirror) -->
    <rect x="154" y="91" width="7"  height="77" fill="#e8e8f0"/>
    <rect x="161" y="91" width="7"  height="77" fill="#445566"/>

    <!-- Chest panel border -->
    <rect x="21"  y="98"  width="126" height="70" fill="none" stroke="#ff6ef7" stroke-width="7"/>

    <!-- Chest center glow orb -->
    <circle cx="84" cy="133" r="18" fill="#ffaa00" opacity="0.3" filter="url(#glow-chest)" class="chest-glow"/>
    <rect x="63" y="112" width="42" height="42" fill="none" stroke="#ff9900" stroke-width="7"/>
    <rect x="70" y="119" width="28" height="28" fill="#ffdd44" opacity="0.7" class="chest-glow"/>

    <!-- Accent dots -->
    <rect x="28"  y="98"  width="7" height="7" fill="#00ffb4" class="eye-inner"/>
    <rect x="133" y="98"  width="7" height="7" fill="#00ffb4" class="eye-inner"/>

    <!-- Legs -->
    <rect x="28"  y="182" width="35" height="14" fill="#445566"/>
    <rect x="35"  y="182" width="21" height="14" fill="#aaaacc"/>
    <rect x="105" y="182" width="35" height="14" fill="#445566"/>
    <rect x="112" y="182" width="21" height="14" fill="#aaaacc"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <g class="glitch-group">
    <!-- Box border -->
    <rect class="border-rect" x="260" y="100" width="310" height="110"
          fill="rgba(0,20,15,0.75)" stroke="#00ffb4" stroke-width="4"/>
    <!-- Corner pixel cutouts -->
    <rect x="258" y="98"  width="10" height="10" fill="#0a0a1a"/>
    <rect x="562" y="98"  width="10" height="10" fill="#0a0a1a"/>
    <rect x="258" y="204" width="10" height="10" fill="#0a0a1a"/>
    <rect x="562" y="204" width="10" height="10" fill="#0a0a1a"/>
    <!-- Outer border glow -->
    <rect class="border-rect" x="256" y="96" width="314" height="114"
          fill="none" stroke="#00ffb4" stroke-width="2" opacity="0.3"/>

    <!-- Text -->
    <text class="title1" x="415" y="150" text-anchor="middle">ENGINEERING</text>
    <text class="title2" x="415" y="185" text-anchor="middle">FORWARD</text>
  </g>

  <!-- Scanlines overlay -->
  <rect width="600" height="400" fill="url(#scanlines)" opacity="0.08"/>
  <defs>
    <pattern id="scanlines" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="black"/>
    </pattern>
  </defs>

</svg>
