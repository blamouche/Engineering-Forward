<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      .title1 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #00cc88;
      }
      .title2 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #cc44cc;
      }

      /* Robot rolls from left to right */
      .robot-roll {
        animation: roll 6s linear infinite;
      }
      @keyframes roll {
        0%   { transform: translateX(-140px); }
        100% { transform: translateX(720px); }
      }

      /* Wheels spin */
      .wheel-spin {
        animation: spin 0.5s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      /* Eye blink */
      .eyes {
        animation: blink 3.5s step-end infinite;
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        93%            { transform: scaleY(0.1); }
      }

      /* Chest glow */
      .chest-core {
        animation: chest 1s ease-in-out infinite alternate;
      }
      @keyframes chest {
        from { opacity: 0.4; }
        to   { opacity: 1; }
      }

      /* Antenna bob */
      .antenna-top {
        animation: antenna-bob 0.5s ease-in-out infinite alternate;
        transform-origin: 42px 14px;
      }
      @keyframes antenna-bob {
        from { transform: rotate(-8deg); }
        to   { transform: rotate(8deg); }
      }

      /* Title fade in */
      .title-group {
        animation: fadein 0.8s ease-out both;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Border pulse */
      .border-box {
        animation: border-pulse 3s ease-in-out infinite;
      }
      @keyframes border-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.5; }
      }

      /* Ground dots scroll in sync with robot */
      .ground-dots {
        animation: ground-scroll 0.5s linear infinite;
      }
      @keyframes ground-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-40px); }
      }
    </style>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#00cc88" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#cc44cc" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-eye" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground line -->
  <line x1="0" y1="172" x2="700" y2="172" stroke="#888" stroke-width="2" opacity="0.25"/>

  <!-- Scrolling pixel ground -->
  <g class="ground-dots" opacity="0.18" fill="#555">
    <rect x="0"   y="176" width="4" height="4"/>
    <rect x="20"  y="176" width="4" height="4"/>
    <rect x="40"  y="176" width="4" height="4"/>
    <rect x="60"  y="176" width="4" height="4"/>
    <rect x="80"  y="176" width="4" height="4"/>
    <rect x="100" y="176" width="4" height="4"/>
    <rect x="120" y="176" width="4" height="4"/>
    <rect x="140" y="176" width="4" height="4"/>
    <rect x="160" y="176" width="4" height="4"/>
    <rect x="180" y="176" width="4" height="4"/>
    <rect x="200" y="176" width="4" height="4"/>
    <rect x="220" y="176" width="4" height="4"/>
    <rect x="240" y="176" width="4" height="4"/>
    <rect x="260" y="176" width="4" height="4"/>
    <rect x="280" y="176" width="4" height="4"/>
    <rect x="300" y="176" width="4" height="4"/>
    <rect x="320" y="176" width="4" height="4"/>
    <rect x="340" y="176" width="4" height="4"/>
    <rect x="360" y="176" width="4" height="4"/>
    <rect x="380" y="176" width="4" height="4"/>
    <rect x="400" y="176" width="4" height="4"/>
    <rect x="420" y="176" width="4" height="4"/>
    <rect x="440" y="176" width="4" height="4"/>
    <rect x="460" y="176" width="4" height="4"/>
    <rect x="480" y="176" width="4" height="4"/>
    <rect x="500" y="176" width="4" height="4"/>
    <rect x="520" y="176" width="4" height="4"/>
    <rect x="540" y="176" width="4" height="4"/>
    <rect x="560" y="176" width="4" height="4"/>
    <rect x="580" y="176" width="4" height="4"/>
    <rect x="600" y="176" width="4" height="4"/>
    <rect x="620" y="176" width="4" height="4"/>
    <rect x="640" y="176" width="4" height="4"/>
    <rect x="660" y="176" width="4" height="4"/>
    <rect x="680" y="176" width="4" height="4"/>
    <rect x="700" y="176" width="4" height="4"/>
    <rect x="720" y="176" width="4" height="4"/>
    <rect x="740" y="176" width="4" height="4"/>
  </g>

  <!-- ======= TITLE ======= -->
  <g class="title-group">
    <rect class="border-box" x="198" y="30" width="304" height="100"
          fill="none" stroke="#00cc88" stroke-width="3"/>
    <rect class="border-box" x="202" y="34" width="296" height="92"
          fill="none" stroke="#00cc88" stroke-width="1" opacity="0.35"/>
    <text class="title1" x="350" y="84"  text-anchor="middle" filter="url(#glow-cyan)">ENGINEERING</text>
    <text class="title2" x="350" y="114" text-anchor="middle" filter="url(#glow-pink)">FORWARD</text>
  </g>

  <!-- ======= ROBOT ON WHEELS ======= -->
  <!--
    Robot body: 84px wide, 90px tall (no legs)
    Wheels: r=18, centers at y=172 (ground level), x=18 and x=66
    Body bottom sits at y = 172 - 18 = 154
    Body top at 154 - 90 = 64
    All coords relative, then translated to y=0 offset
  -->
  <g class="robot-roll">
    <g transform="translate(0, 0)">

      <!-- Antenna (bobs) -->
      <g class="antenna-top">
        <rect x="36" y="14" width="12" height="6"  fill="#00cc88"/>
        <rect x="39" y="20" width="6"  height="6"  fill="#00cc88"/>
      </g>
      <rect x="39" y="26" width="6" height="10" fill="#445566"/>

      <!-- Head -->
      <rect x="18" y="36" width="48" height="6"  fill="#334455"/>
      <rect x="12" y="42" width="60" height="36" fill="#dde0ee"/>
      <!-- Eyes -->
      <rect x="18" y="48" width="18" height="12" fill="#ffdd44"/>
      <rect x="48" y="48" width="18" height="12" fill="#ffdd44"/>
      <g class="eyes">
        <rect x="21" y="51" width="6" height="6" fill="#00cc88" filter="url(#glow-eye)"/>
        <rect x="57" y="51" width="6" height="6" fill="#00cc88" filter="url(#glow-eye)"/>
      </g>
      <!-- Mouth -->
      <rect x="22" y="66" width="40" height="6" fill="#aabbcc"/>
      <rect x="28" y="66" width="6"  height="6" fill="#dde0ee"/>
      <rect x="40" y="66" width="6"  height="6" fill="#dde0ee"/>
      <rect x="52" y="66" width="6"  height="6" fill="#dde0ee"/>
      <!-- Head bottom border -->
      <rect x="18" y="78" width="48" height="6" fill="#334455"/>

      <!-- Neck -->
      <rect x="30" y="84" width="24" height="8" fill="#aabbcc"/>

      <!-- Body -->
      <rect x="6"  y="92"  width="72" height="62" fill="#334455"/>
      <rect x="12" y="98"  width="60" height="50" fill="#dde0ee"/>
      <!-- Chest panel border -->
      <rect x="20" y="104" width="44" height="36" fill="none" stroke="#cc44cc" stroke-width="3"/>
      <!-- Chest core -->
      <rect x="28" y="112" width="28" height="20" fill="#ffaa00" class="chest-core"/>
      <rect x="34" y="116" width="16" height="12" fill="#ffee88" class="chest-core"/>
      <!-- Body bottom border -->
      <rect x="6"  y="154" width="72" height="6" fill="#334455"/>

      <!-- Axle bar -->
      <rect x="10" y="156" width="64" height="4" fill="#223344"/>

      <!-- LEFT WHEEL (spins around its center) -->
      <!-- center: x=24, y=172 -->
      <g transform="translate(24, 172)">
        <g class="wheel-spin">
          <!-- Tyre (pixel circle approx r=16) -->
          <rect x="-16" y="-6"  width="32" height="12" fill="#223344"/>
          <rect x="-6"  y="-16" width="12" height="32"  fill="#223344"/>
          <rect x="-12" y="-12" width="24" height="24"  fill="#223344"/>
          <!-- Rim -->
          <rect x="-10" y="-4"  width="20" height="8"  fill="#778899"/>
          <rect x="-4"  y="-10" width="8"  height="20" fill="#778899"/>
          <!-- Hub -->
          <rect x="-4" y="-4" width="8" height="8" fill="#00cc88"/>
          <!-- Spokes (cross) -->
          <rect x="-12" y="-2" width="24" height="4" fill="#556677"/>
          <rect x="-2" y="-12" width="4" height="24" fill="#556677"/>
        </g>
        <!-- Outer tyre ring (static, so it looks like a tyre) -->
        <rect x="-16" y="-4"  width="4" height="8"  fill="#445566" opacity="0.5"/>
        <rect x="12"  y="-4"  width="4" height="8"  fill="#445566" opacity="0.5"/>
      </g>

      <!-- RIGHT WHEEL (spins around its center) -->
      <!-- center: x=60, y=172 -->
      <g transform="translate(60, 172)">
        <g class="wheel-spin">
          <rect x="-16" y="-6"  width="32" height="12" fill="#223344"/>
          <rect x="-6"  y="-16" width="12" height="32"  fill="#223344"/>
          <rect x="-12" y="-12" width="24" height="24"  fill="#223344"/>
          <rect x="-10" y="-4"  width="20" height="8"  fill="#778899"/>
          <rect x="-4"  y="-10" width="8"  height="20" fill="#778899"/>
          <rect x="-4" y="-4" width="8" height="8" fill="#00cc88"/>
          <rect x="-12" y="-2" width="24" height="4" fill="#556677"/>
          <rect x="-2" y="-12" width="4" height="24" fill="#556677"/>
        </g>
        <rect x="-16" y="-4"  width="4" height="8"  fill="#445566" opacity="0.5"/>
        <rect x="12"  y="-4"  width="4" height="8"  fill="#445566" opacity="0.5"/>
      </g>

    </g>
  </g>

</svg>
