<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      .title1 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #00cc88;
      }
      .title2 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #cc44cc;
      }

      /* Robot walks from left (-120) to right (720), loops */
      .robot-walk {
        animation: walk 6s linear infinite;
      }
      @keyframes walk {
        0%   { transform: translateX(-130px); }
        100% { transform: translateX(720px); }
      }

      /* Leg oscillation */
      .leg-l {
        transform-origin: 30px 0px;
        animation: leg-osc 0.4s ease-in-out infinite alternate;
      }
      .leg-r {
        transform-origin: 54px 0px;
        animation: leg-osc 0.4s ease-in-out infinite alternate-reverse;
      }
      @keyframes leg-osc {
        0%   { transform: rotate(-20deg); }
        100% { transform: rotate(20deg); }
      }

      /* Arm swing */
      .arm-l {
        transform-origin: 6px 0px;
        animation: arm-osc 0.4s ease-in-out infinite alternate-reverse;
      }
      .arm-r {
        transform-origin: 6px 0px;
        animation: arm-osc 0.4s ease-in-out infinite alternate;
      }
      @keyframes arm-osc {
        0%   { transform: rotate(-25deg); }
        100% { transform: rotate(25deg); }
      }

      /* Eye blink */
      .eye-l { animation: blink 3s step-end infinite; transform-origin: 24px 36px; }
      .eye-r { animation: blink 3s step-end infinite; transform-origin: 60px 36px; }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        93%            { transform: scaleY(0.1); }
      }

      /* Title fade in */
      .title-group {
        animation: fadein 0.8s ease-out both;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Border pulse */
      .border-box {
        animation: border-pulse 3s ease-in-out infinite;
      }
      @keyframes border-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.5; }
      }

      /* Chest glow */
      .chest-core {
        animation: chest 1s ease-in-out infinite alternate;
      }
      @keyframes chest {
        0%   { opacity: 0.4; }
        100% { opacity: 1; }
      }

      /* Scrolling ground dots in sync with robot speed */
      .ground-dots {
        animation: ground-scroll 0.8s linear infinite;
      }
      @keyframes ground-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-40px); }
      }
    </style>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#00cc88" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#cc44cc" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-eye" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- NO background rect = transparent -->

  <!-- Ground line -->
  <line x1="0" y1="176" x2="700" y2="176" stroke="#888" stroke-width="2" opacity="0.25"/>

  <!-- Scrolling pixel ground -->
  <g class="ground-dots" opacity="0.2" fill="#555">
    <!-- Two full widths so the loop is seamless -->
    <rect x="0"   y="180" width="4" height="4"/>
    <rect x="20"  y="180" width="4" height="4"/>
    <rect x="40"  y="180" width="4" height="4"/>
    <rect x="60"  y="180" width="4" height="4"/>
    <rect x="80"  y="180" width="4" height="4"/>
    <rect x="100" y="180" width="4" height="4"/>
    <rect x="120" y="180" width="4" height="4"/>
    <rect x="140" y="180" width="4" height="4"/>
    <rect x="160" y="180" width="4" height="4"/>
    <rect x="180" y="180" width="4" height="4"/>
    <rect x="200" y="180" width="4" height="4"/>
    <rect x="220" y="180" width="4" height="4"/>
    <rect x="240" y="180" width="4" height="4"/>
    <rect x="260" y="180" width="4" height="4"/>
    <rect x="280" y="180" width="4" height="4"/>
    <rect x="300" y="180" width="4" height="4"/>
    <rect x="320" y="180" width="4" height="4"/>
    <rect x="340" y="180" width="4" height="4"/>
    <rect x="360" y="180" width="4" height="4"/>
    <rect x="380" y="180" width="4" height="4"/>
    <rect x="400" y="180" width="4" height="4"/>
    <rect x="420" y="180" width="4" height="4"/>
    <rect x="440" y="180" width="4" height="4"/>
    <rect x="460" y="180" width="4" height="4"/>
    <rect x="480" y="180" width="4" height="4"/>
    <rect x="500" y="180" width="4" height="4"/>
    <rect x="520" y="180" width="4" height="4"/>
    <rect x="540" y="180" width="4" height="4"/>
    <rect x="560" y="180" width="4" height="4"/>
    <rect x="580" y="180" width="4" height="4"/>
    <rect x="600" y="180" width="4" height="4"/>
    <rect x="620" y="180" width="4" height="4"/>
    <rect x="640" y="180" width="4" height="4"/>
    <rect x="660" y="180" width="4" height="4"/>
    <rect x="680" y="180" width="4" height="4"/>
    <rect x="700" y="180" width="4" height="4"/>
    <rect x="720" y="180" width="4" height="4"/>
    <rect x="740" y="180" width="4" height="4"/>
  </g>

  <!-- ======= TITLE (centered, static) ======= -->
  <g class="title-group">
    <rect class="border-box" x="198" y="30" width="304" height="100"
          fill="none" stroke="#00cc88" stroke-width="3"/>
    <rect class="border-box" x="202" y="34" width="296" height="92"
          fill="none" stroke="#00cc88" stroke-width="1" opacity="0.35"/>
    <text class="title1" x="350" y="84"  text-anchor="middle" filter="url(#glow-cyan)">ENGINEERING</text>
    <text class="title2" x="350" y="114" text-anchor="middle" filter="url(#glow-pink)">FORWARD</text>
  </g>

  <!-- ======= ROBOT walking ======= -->
  <!-- Pixel = 6px. Robot ~84px wide, feet at y=176 so top at ~62 -->
  <g class="robot-walk">
    <g transform="translate(0, 62)">

      <!-- Antenna top -->
      <rect x="36" y="0"  width="12" height="6" fill="#00cc88"/>
      <rect x="39" y="6"  width="6"  height="6" fill="#00cc88"/>
      <rect x="39" y="12" width="6"  height="6" fill="#445566"/>

      <!-- Head outer -->
      <rect x="18" y="18" width="48" height="6"  fill="#334455"/>
      <!-- Head face bg -->
      <rect x="12" y="24" width="60" height="36" fill="#dde0ee"/>
      <!-- Eye sockets -->
      <rect x="18" y="30" width="18" height="12" fill="#ffdd44"/>
      <rect x="48" y="30" width="18" height="12" fill="#ffdd44"/>
      <!-- Eye pupils -->
      <g class="eye-l">
        <rect x="21" y="33" width="6" height="6" fill="#00cc88" filter="url(#glow-eye)"/>
      </g>
      <g class="eye-r">
        <rect x="57" y="33" width="6" height="6" fill="#00cc88" filter="url(#glow-eye)"/>
      </g>
      <!-- Mouth -->
      <rect x="22" y="48" width="40" height="6" fill="#aabbcc"/>
      <rect x="28" y="48" width="6"  height="6" fill="#dde0ee"/>
      <rect x="40" y="48" width="6"  height="6" fill="#dde0ee"/>
      <rect x="52" y="48" width="6"  height="6" fill="#dde0ee"/>
      <!-- Head bottom -->
      <rect x="18" y="60" width="48" height="6" fill="#334455"/>

      <!-- Neck -->
      <rect x="30" y="66" width="24" height="6" fill="#aabbcc"/>

      <!-- Left arm (swings) -->
      <g class="arm-l" transform="translate(6, 72)">
        <rect x="0" y="0" width="6"  height="36" fill="#dde0ee"/>
        <rect x="-6" y="0" width="6" height="36" fill="#334455"/>
      </g>
      <!-- Right arm (swings) -->
      <g class="arm-r" transform="translate(72, 72)">
        <rect x="0"  y="0" width="6" height="36" fill="#dde0ee"/>
        <rect x="6"  y="0" width="6" height="36" fill="#334455"/>
      </g>

      <!-- Torso -->
      <rect x="12" y="72" width="60" height="48" fill="#334455"/>
      <rect x="18" y="78" width="48" height="36" fill="#dde0ee"/>
      <!-- Chest panel -->
      <rect x="24" y="84" width="36" height="24" fill="none" stroke="#cc44cc" stroke-width="3"/>
      <!-- Chest core glow -->
      <rect x="30" y="90" width="24" height="12" fill="#ffaa00" class="chest-core"/>
      <rect x="36" y="93" width="12" height="6"  fill="#ffee88" class="chest-core"/>

      <!-- Torso bottom -->
      <rect x="12" y="120" width="60" height="6" fill="#334455"/>

      <!-- Left leg -->
      <g class="leg-l" transform="translate(12, 126)">
        <rect x="0"  y="0" width="24" height="30" fill="#334455"/>
        <rect x="6"  y="0" width="12" height="30" fill="#aabbcc"/>
        <rect x="-6" y="30" width="36" height="8" fill="#334455"/>
      </g>
      <!-- Right leg -->
      <g class="leg-r" transform="translate(48, 126)">
        <rect x="-12" y="0" width="24" height="30" fill="#334455"/>
        <rect x="-6"  y="0" width="12" height="30" fill="#aabbcc"/>
        <rect x="-18" y="30" width="36" height="8" fill="#334455"/>
      </g>

    </g>
  </g>

</svg>
